<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de adoção</title>

    <link rel="stylesheet" href="adote-um-peixe.css">
</head>

<body>
    <h1>Adote um animal</h1>
    <h2>Cada adoção financia ações reais de preservação</h2>
    <p class="estatisticas">6 espécies estão disponíveis para adoção</p>

    <div class="galeria">
        <div class="card">
            <h3>Peixe-palhaço</h3>
            <img src="https://images.unsplash.com/photo-1535591273668-578e31182c4f?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Peixe-palhaço" />
            <span class="status-vulneravel">VULNERÁVEL</span>
            <button onclick="adotar('Peixe-palhaço')">Adotar</button>
        </div>

        <div class="card">
            <h3>Cavalo-marinho</h3>
            <img src="https://images.unsplash.com/photo-1739648310673-1ed8f56c058f?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="Cavalo-marinho" />
            <span class="status-vulneravel">VULNERÁVEL</span>
            <button onclick="adotar('Cavalo-marinho')">Adotar</button>
        </div>

        <div class="card">
            <h3>Tartaruga-marinha</h3>
            <img src="https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Tartaruga-marinha" />
            <span class="status-critico">CRÍTICO</span>
            <button onclick="adotar('Tartaruga-marinha')">Adotar</button>
        </div>

        <div class="card">
            <h3>Polvo</h3>
            <img src="https://images.unsplash.com/photo-1628944681206-2ee8d63b0a6b?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="Polvo" />
            <span class="status-estavel">ESTÁVEL</span>
            <button onclick="adotar('Polvo')">Adotar</button>
        </div>

        <div class="card">
            <h3>Arraia</h3>
            <img src="https://images.unsplash.com/photo-1560364897-12528532f1c6?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Arraia" />
            <span class="status-vulneravel">VULNERÁVEL</span>
            <button onclick="adotar('Arraia')">Adotar</button>
        </div>

        <div class="card">
            <h3>Baleia</h3>
            <img src="https://images.unsplash.com/photo-1568430462989-44163eb1752f?q=80&w=1473&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Baleia" />
            <span class="status-critico">AMEAÇADO</span>
            <button onclick="adotar('Baleia')">Adotar</button>
        </div>
    </div>

</body>

</html>
